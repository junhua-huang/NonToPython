name: APNs and mobile push contracts
on:
  push:
    branches: [ios]
  pull_request:
    paths: ['app/**', 'alembic/**', 'tests/**', 'requirements.txt', '.github/workflows/apns.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest requests
      - name: Test APNs and existing mobile push contracts
        run: python -m pytest tests/test_apns_push.py tests/test_aliyun_push_contracts.py tests/test_app_state_push_contracts.py tests/test_push_dedupe_contracts.py tests/test_notification_service_unit.py tests/test_presence_app_state_contracts.py -q
      - name: Verify migration head
        run: python -m alembic heads
