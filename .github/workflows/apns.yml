name: APNs and mobile push contracts
on:
  push:
    branches: [ios]
  pull_request:
    paths: ['app/**', 'alembic/**', 'tests/**', 'requirements.txt', '.github/workflows/apns.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest requests
      - name: Test APNs and existing mobile push contracts
        run: python -m pytest tests/test_apns_push.py tests/test_aliyun_push_contracts.py tests/test_app_state_push_contracts.py tests/test_push_dedupe_contracts.py tests/test_notification_service_unit.py tests/test_presence_app_state_contracts.py -q
      - name: Verify migration head
        run: python -m alembic heads
      - name: Verify read-only privacy inventory
        run: python -m unittest discover -s tests -p test_account_privacy_inventory.py -v
      - name: Verify account erasure and cloud retry boundaries
        run: python -m unittest discover -s tests -p test_account_erasure.py -v
      - name: Verify authentication, replay, shared ownership and lifecycle regressions
        run: python -m pytest tests/test_account_disabled_contract.py tests/test_auth_registration_rules.py tests/test_email_privacy_contracts.py tests/test_quote_service_contracts.py tests/test_ws_validation_unit.py tests/test_ws_manager_scheduling.py tests/test_community_service_sql.py tests/test_deployments_api.py tests/test_moderation_snapshot.py tests/test_admin_bots_api.py tests/test_open_api.py tests/test_privacy_routes.py -q
  mysql-erasure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: nonto-test-only
          MYSQL_DATABASE: nonto_erasure_tests
          MYSQL_USER: nonto_test
          MYSQL_PASSWORD: nonto-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pnonto-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_USER: nonto_test
      DB_PASS: nonto-test-only
      DB_NAME: nonto_erasure_tests
      NONTO_ERASURE_TEST_DATABASE_URL: mysql+pymysql://nonto_test:nonto-test-only@127.0.0.1:3306/nonto_erasure_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt cryptography
      - name: Prepare the previous schema and verify the real upgrade
        run: |
          python - <<'PY'
          import importlib.util
          from sqlalchemy import text
          from app.database import Base, engine
          import app.models.models, app.models.community, app.models.deployment, app.models.privacy
          Base.metadata.create_all(engine)
          spec = importlib.util.spec_from_file_location('erasure_migration', 'alembic/versions/2026_10_24_0100_account_erasure.py')
          migration = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(migration)
          with engine.begin() as connection:
              connection.execute(text('DROP TABLE account_erasures'))
              for table, column in migration.ATTRIBUTIONS:
                  connection.execute(text(f'ALTER TABLE {table} MODIFY {column} INTEGER NOT NULL'))
          PY
          python -m alembic stamp 2026_10_18_0100
          python -m alembic upgrade head
      - name: Verify erasure against MySQL foreign keys and subquery rules
        run: python -m unittest discover -s tests -p test_account_erasure.py -v
