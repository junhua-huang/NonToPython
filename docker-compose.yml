services:
  nantupy-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nantupy-backend:baota
    container_name: nantupy-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nfrom urllib.request import urlopen\nurlopen('http://127.0.0.1:5000/docs', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
